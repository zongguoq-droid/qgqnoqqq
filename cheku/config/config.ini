; ================================================================
;  智能车载终端 - 配置文件
;  路径: /etc/car_terminal/config.ini (开发板)
;        ./config/config.ini (开发测试)
;
;  格式说明:
;    [section] = 配置节
;    key = value = 键值对
;    ; 或 # 开头 = 注释行
; ================================================================

[system]
; 日志级别: 0=DEBUG, 1=INFO, 2=WARN, 3=ERROR
log_level = 1
; 日志文件路径
log_path = /var/log/car_terminal/
; 单个日志文件最大大小 (MB)
log_max_size = 10
; 日志轮转保留份数
log_rotate_count = 5

[guard]
; 心跳检测间隔 (秒)
heartbeat_interval = 5
; 短时间内最大重启次数 (防止无限重启)
max_restart_count = 5
; 重启计数窗口 (秒, 超过此时间重置计数)
restart_window = 60

[gps]
; GPS 串口设备节点 (i.MX6ULL 原生 UART5)
uart_device = /dev/ttymxc5
; 波特率 (GPS 模块通常为 9600)
baud_rate = 9600
; 数据上报间隔 (秒)
report_interval = 1

[dvr]
; USB 摄像头设备节点
camera_dev = /dev/video1
; 录像存储路径
record_path = /record
; 录像存储上限 (MB)
max_size_mb = 2000
; 分段时长 (秒)
seg_duration = 60

[sensor]
; DHT11 内核驱动设备路径
device = /dev/mydht11
; 采样间隔 (毫秒, DHT11 最快 1Hz → 最小 1000ms)
sample_interval = 2000
; 高温告警阈值 (摄氏度)
temp_high = 50.0
; 低温告警阈值 (摄氏度)
temp_low = -10.0
; 高湿告警阈值 (%RH)
humidity_high = 90.0
; 低湿告警阈值 (%RH)
humidity_low = 20.0
; 告警使能 (true/false)
alert_enable = true
; 告警冷却时间 (秒, 避免频繁告警)
alert_cooldown = 60

[canbus]
; CAN 接口名称
interface = can0
; CAN 波特率 (bps)
bitrate = 500000

[audio]
; ALSA PCM 设备名
pcm_device = hw:0,0
; 默认音量 (0-100)
default_volume = 70
; 采样率 (Hz)
sample_rate = 44100

[network]
; 云端服务器地址
cloud_server = api.carcloud.example.com
; 云端服务器端口
cloud_port = 8080
; 数据上报间隔 (秒)
upload_interval = 30

[input]
; 输入设备路径
device = /dev/input/event2
; sysfs LED 名称 (按键闪烁反馈)
; 长按判定阈值 (毫秒)
long_press_ms = 2000
; 双击间隔阈值 (毫秒)
double_click_ms = 500

; ================================================================
;  进程启停表 — 由 guard_daemon 读取
;
;  本节控制 guard_daemon 实际拉起并监控哪些子进程。
;  1 = 启动并监控, 0 = 仅保留定义, 不启动不监控。
;
;  说明:
;    - 本节不存在或某进程未列出时, 使用代码内置的默认启停设置
;    - sensor_daemon 的功能已由 Qt 界面的 SensorThread 直读
;      /dev/mydht11 实现, 因此默认关闭
;    - net_daemon (云端通信) 尚未部署, 默认关闭
;    - 关闭的进程仍会在 UI 服务面板中显示为"未启用",
;      便于了解系统规划中有哪些服务
;
;  修改本节后需重启 guard_daemon 生效:
;    stop_all.sh && start_all.sh
; ================================================================
[processes]
gps_daemon    = 1
sensor_daemon = 0
input_daemon  = 1
canbus_daemon = 1
av_daemon     = 1
dvr_daemon    = 1
net_daemon    = 0
